llm:
  chat_model: deepseek-v4-pro
  non_reasoning_chat_model: deepseek-v4-flash
  memory_model: deepseek-v4-flash
  embedding_model: doubao-embedding-vision-251215
  chat_base_url: https://api.deepseek.com/v1
  embedding_base_url: https://ark.cn-beijing.volces.com/api/v3
  temperature: 0.7
  memory_temperature: 0.3
  max_tokens: 4096
  reasoning_mode: false
  timeout: 60
  top_p: 1.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  repetition_penalty: 1.0
  reasoning_effort: high
app:
  context_history_limit: 15
  retrieval_top_k: 3
  retrieval_context_turns: 3
  retrieval_query_max_chars: 2400
  memory_extract_history_limit: 20
  memory_handoff_margin: 2
  retrieval_min_importance: 0.3
  cognition_update_interval: 30
  cognition_importance_threshold: 0.8
  lorebook_scan_depth: 5
  lorebook_token_budget: 3000
  lorebook_max_recursive_passes: 3
  sqlite_db_path: data/data.db
  chroma_db_path: data/chroma_data
  upload_avatar_dir: ./assets/avatars
  cors_origins:
  - '*'
  max_card_size_mb: 10
  history_fetch_default: 50
  history_fetch_max: 500
  retrieval_max_distance: 1.2  # 0 仅允许精确距离，负数禁用本轮长期记忆召回
  cognition_max_words: 200
  retrieval_half_life_turns: 50
  retrieval_candidate_multiplier: 3
  dedup_write_threshold: 0.15
  graph_min_importance: 0.5
  graph_max_relations: 12
  retrieval_weight_similarity: 0.6
  retrieval_weight_importance: 0.2
  retrieval_weight_time: 0.2
  retrieval_ancestor_weight: 0.8
  rp_time_tiers:
  - max_turns: 30
    label: 刚刚
  - max_turns: 100
    label: 近期
  - max_turns: 300
    label: 一段时间前
  - max_turns: 9999999
    label: 很久以前
tts:
  enabled: true
  base_url: https://api.xiaomimimo.com/v1
  model: mimo-v2.5-tts
  default_voice: 冰糖
  cache_dir: data/audio_cache
  max_cache_files: 500
